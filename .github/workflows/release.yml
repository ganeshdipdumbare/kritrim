name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          check-latest: true
      - name: test
        run: go test -race ./...
      - name: build
        run: |
          set -euo pipefail
          ver="$GITHUB_REF_NAME"
          mkdir -p dist
          build() { # os arch cmd
            ext=""
            [ "$1" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath -ldflags="-s -w -buildid=" \
              -o "dist/${3}_${ver}_${1}_${2}${ext}" "./cmd/$3"
          }
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            build "${target%/*}" "${target#*/}" kritrim
            build "${target%/*}" "${target#*/}" kritrim-evals
          done
          build linux amd64 kritrim-vmagent
          build linux arm64 kritrim-vmagent
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: release notes
        run: |
          awk -v v="## $GITHUB_REF_NAME" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" = "true" ]; then
              gh release upload "$tag" dist/* --clobber
              gh release edit "$tag" --verify-tag --title "kritrim $tag" --notes-file notes.md --draft=false
            else
              echo "release $tag is already published; leaving it unchanged"
            fi
          else
            gh release create "$tag" dist/* --verify-tag --title "kritrim $tag" --notes-file notes.md
          fi
