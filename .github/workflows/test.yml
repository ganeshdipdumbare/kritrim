name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
      - name: benchmarks (smoke)
        run: go test -run='^$' -bench=. -benchtime=1x ./...
      - name: examples build
        run: go build ./examples/...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzPaths -fuzztime=30s .
          go test -run='^$' -fuzz=FuzzValue -fuzztime=30s ./internal/jsonschema
          go test -run='^$' -fuzz=FuzzPublic -fuzztime=30s ./internal/netguard
          go test -run='^$' -fuzz=FuzzCron -fuzztime=30s ./trigger

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - name: compatibility with the latest v1 release
        run: |
          base=$(git tag --list 'v1.*' --sort=-v:refname | head -n1)
          if [ -z "$base" ]; then
            echo "no v1 release yet; nothing to compare"
            exit 0
          fi
          go run golang.org/x/exp/cmd/gorelease@latest -base="$base"
