  <g transform="translate(72 64)">
    <rect width="88" height="88" rx="22" fill="#111110"/>
    <path d="M24 18h10v19l21-19h12.6L43.4 41.2 69 70H55.8L34 47.4V70H24Z" fill="#f6f4ee"/>
