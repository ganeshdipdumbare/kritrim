  <text x="184" y="128" font-family="Geist, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-3" fill="#111110">kritrim</text>
  <text x="72" y="266" font-family="Geist, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.8" fill="#111110">Agents that are simple to write.</text>
  <text x="72" y="340" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="64" fill="#a62a15">Secure by default.</text>
  <text x="72" y="404" font-family="Geist, Arial, sans-serif" font-size="21" fill="#55534d">One model, one tool constructor, one run call.</text>
  <text x="72" y="438" font-family="Geist, Arial, sans-serif" font-size="21" fill="#55534d">Every built-in capability goes through one broker — and the whole</text>
  <text x="72" y="472" font-family="Geist, Arial, sans-serif" font-size="21" fill="#55534d">agent can run inside a sealed sandbox.</text>
  <g transform="translate(72 528)" font-family="Geist Mono, monospace" font-size="15" letter-spacing="1.2" fill="#55534d">
    <circle cx="5" cy="-5" r="5" fill="#e8452c"/>
    <text x="22" y="0">ONE RUN CALL</text>
    <text x="176" y="0">·</text>
    <text x="200" y="0">BROKERED TOOLS</text>
    <text x="376" y="0">·</text>
    <text x="400" y="0">SEALED AGENT</text>
  </g>
  <text x="1128" y="566" text-anchor="end" font-family="Geist Mono, monospace" font-size="16" fill="#7d7971">kritrim docs</text>
